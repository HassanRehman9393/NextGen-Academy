apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: nextgen-academy
data:
  NODE_ENV: "production"
  PORT: "8080"
  MONGODB_URI: "mongodb://mongodb:27017/nextgen-academy"
  GOOGLE_CLIENT_ID: "dummy-client-id"
  GOOGLE_CLIENT_SECRET: "dummy-client-secret"
  GITHUB_CLIENT_ID: "dummy-client-id"
  GITHUB_CLIENT_SECRET: "dummy-client-secret"
  FACEBOOK_CLIENT_ID: "dummy-client-id"
  FACEBOOK_CLIENT_SECRET: "dummy-client-secret"
  JWT_SECRET: "nextgen-academy-jwt-secret-for-kubernetes"
  REFRESH_TOKEN_SECRET: "nextgen-academy-refresh-token-secret"
  JWT_EXPIRATION: "24h"
  REFRESH_TOKEN_EXPIRATION: "30d" 