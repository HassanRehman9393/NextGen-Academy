apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextgen-frontend
  namespace: nextgen-academy
  labels:
    app: nextgen-frontend
    tier: frontend
spec:
  # Define 2 replicas for high availability
  replicas: 2
  selector:
    matchLabels:
      app: nextgen-frontend
  template:
    metadata:
      labels:
        app: nextgen-frontend
    spec:
      containers:
      - name: nextgen-frontend
        image: ${hassangill}/nextgen-academy-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          # Point to the backend service within the Kubernetes cluster
          value: http://nextgen-backend-service:8080/api
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
