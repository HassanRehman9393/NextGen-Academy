apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: nextgen-academy
  labels:
    app: mongodb
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:4.4
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password"
        - name: MONGO_INITDB_DATABASE
          value: "nextgen-academy"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-data-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data-claim
  namespace: nextgen-academy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi