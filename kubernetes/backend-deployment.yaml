apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nextgen-academy
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hassangill/nextgen-academy-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Patch socialAuthService.js to skip OAuth initialization
            sed -i 's/initializeStrategies() {/initializeStrategies() { if (process.env.NODE_ENV === "production") { console.log("Skipping OAuth setup in production"); return; }/g' /app/src/modules/auth/services/socialAuthService.js
            # Start the application
            node app.js
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: backend-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
      volumes:
      - name: patch-script
        configMap:
          name: backend-patch-script 
