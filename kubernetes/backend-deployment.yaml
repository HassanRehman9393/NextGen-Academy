apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextgen-backend
  namespace: nextgen-academy
  labels:
    app: nextgen-backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextgen-backend
  template:
    metadata:
      labels:
        app: nextgen-backend
    spec:
      containers:
      - name: nextgen-backend
        image: hassangill/nextgen-academy-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"        - name: PORT
          value: "8080"
        - name: MONGODB_URI
          value: "mongodb://admin:password@mongodb.nextgen-academy.svc.cluster.local:27017/nextgen-academy?authSource=admin"
        - name: JWT_SECRET
          value: "nextgen-academy-secret-key-for-development"
        # Facebook OAuth
        - name: FACEBOOK_APP_ID
          value: "dummy-facebook-app-id"
        - name: FACEBOOK_APP_SECRET
          value: "dummy-facebook-app-secret"
        # Google OAuth
        - name: GOOGLE_CLIENT_ID
          value: "dummy-google-client-id"
        - name: GOOGLE_CLIENT_SECRET
          value: "dummy-google-client-secret"
        # Auth mode - Set to disable social auth in development
        - name: AUTH_MODE
          value: "basic"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30