apiVersion: v1
kind: Service
metadata:
  name: nextgen-frontend-service
  namespace: nextgen-academy
  labels:
    app: nextgen-frontend
    tier: frontend
spec:
  # Use NodePort to expose the frontend externally through Minikube
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    # nodePort must be between 30000-32767
    nodePort: 30000
    name: http
  selector:
    app: nextgen-frontend
