name: Build and Deploy to Minikube

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Configure Docker to point at Minikube's daemon
    - name: Set up Docker to use Minikube's environment
      run: |
        echo "Configuring Docker to use Minikube's daemon..."
        minikube docker-env | Invoke-Expression
      shell: powershell

    # Step 3: Build the Docker images
    - name: Build Docker images
      run: |
        # Build backend image
        cd backend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-backend:latest .
        
        # Build frontend image
        cd ../frontend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-frontend:latest .
      shell: powershell

    # Step 4: Log in to Docker Hub
    - name: Login to Docker Hub
      run: |
        $password = "${{ secrets.DOCKER_PASSWORD }}"
        $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
        $cred = New-Object System.Management.Automation.PSCredential ("${{ secrets.DOCKER_USERNAME }}", $securePassword)
        $password = $cred.GetNetworkCredential().Password
        echo $password | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      shell: powershell

    # Step 5: Push the images to Docker Hub
    - name: Push Docker images to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-frontend:latest
      shell: powershell

    # Prepare deployment files
    - name: Update deployment files
      run: |
        # Replace placeholder with actual Docker Hub username
        (Get-Content kubernetes/backend-deployment.yaml) -replace '\${DOCKER_USERNAME}', '${{ secrets.DOCKER_USERNAME }}' | Set-Content kubernetes/backend-deployment.yaml
        (Get-Content kubernetes/frontend-deployment.yaml) -replace '\${DOCKER_USERNAME}', '${{ secrets.DOCKER_USERNAME }}' | Set-Content kubernetes/frontend-deployment.yaml
      shell: powershell

    # Step 6: Deploy to the Minikube cluster
    - name: Deploy to Minikube
      run: |
        # Create namespace if it doesn't exist
        kubectl apply -f kubernetes/namespace.yaml
        
        # Apply MongoDB resources
        kubectl apply -f kubernetes/mongodb-deployment.yaml
        kubectl apply -f kubernetes/mongodb-service.yaml
        
        # Apply backend resources
        kubectl apply -f kubernetes/backend-deployment.yaml
        kubectl apply -f kubernetes/backend-service.yaml
        
        # Apply frontend resources
        kubectl apply -f kubernetes/frontend-deployment.yaml
        kubectl apply -f kubernetes/frontend-service.yaml
        
        # Verify deployment
        echo "Deployment completed. Verifying..."
        kubectl get pods -n nextgen-academy
        kubectl get services -n nextgen-academy
      shell: powershell 