name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check Docker status
      run: |
        try {
          $dockerStatus = docker info 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Docker is not running! Please start Docker Desktop before running this workflow."
            exit 1
          } else {
            Write-Host "Docker is running correctly."
          }
        } catch {
          Write-Host "Error checking Docker status. Make sure Docker Desktop is installed and running."
          exit 1
        }
      shell: powershell
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-frontend:latest
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-backend:latest
    
    - name: Update Kubernetes manifests with Docker Hub username
      run: |
        $files = @("./kubernetes/frontend-deployment.yaml", "./kubernetes/backend-deployment.yaml")
        foreach ($file in $files) {
          (Get-Content $file) -replace '\$\{hassangill\}', "${{ secrets.DOCKER_USERNAME }}" | Set-Content $file
        }
      shell: powershell
      
    - name: Ensure Minikube is running
      run: |
        $status = minikube status | Out-String
        if ($status -match "Stopped|Nonexistent") {
          Write-Host "Starting Minikube with appropriate resources..."
          minikube start --cpus 2 --memory 3000
        } else {
          Write-Host "Minikube is already running"
        }
        
        # Ensure kubectl can connect
        minikube update-context
        kubectl get nodes
      shell: powershell
    
    - name: Deploy to Kubernetes
      run: |
        # Create the namespace if it doesnt exist
        kubectl apply -f ./kubernetes/namespace.yaml
        
        # Apply deployments and services
        kubectl apply -f ./kubernetes/backend-deployment.yaml
        kubectl apply -f ./kubernetes/backend-service.yaml
        kubectl apply -f ./kubernetes/frontend-deployment.yaml
        kubectl apply -f ./kubernetes/frontend-service.yaml
        
        # Wait for deployments to be ready
        kubectl rollout status deployment/nextgen-frontend -n nextgen-academy --timeout=180s
        kubectl rollout status deployment/nextgen-backend -n nextgen-academy --timeout=180s
      shell: powershell
    
    - name: Verify deployment
      run: |
        Write-Host "Checking pods status..."
        kubectl get pods -n nextgen-academy
        
        Write-Host "Checking services status..."
        kubectl get services -n nextgen-academy
        
        Write-Host "Frontend service URL:"
        minikube service nextgen-frontend-service -n nextgen-academy --url
      shell: powershell
