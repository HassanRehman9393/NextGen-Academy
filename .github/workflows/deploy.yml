name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check Docker status
      run: |
        try {
          $dockerStatus = docker version 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Docker is not running! Please start Docker Desktop before running this workflow."
            exit 1
          } else {
            Write-Host "Docker is running correctly."
            # Additional verification to ensure Docker is fully operational
            docker ps
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker daemon is responsive and operational."
            } else {
              Write-Host "Docker daemon is running but may not be fully operational."
            }
          }
        } catch {
          Write-Host "Error checking Docker status: $_"
          Write-Host "Make sure Docker Desktop is installed and running."
          exit 1
        }
      shell: powershell
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub with retry
      run: |
        $maxRetries = 5
        $retryCount = 0
        $success = $false

        Write-Host "Attempting to log in to Docker Hub..."
        
        while (-not $success -and $retryCount -lt $maxRetries) {
          try {
            $retryCount++
            Write-Host "Login attempt $retryCount of $maxRetries..."
            
            # Configure Docker to use a longer timeout
            $env:DOCKER_CLIENT_TIMEOUT = "180"
            $env:COMPOSE_HTTP_TIMEOUT = "180"
            
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "Successfully logged in to Docker Hub!"
            } else {
              Write-Host "Login failed. Will retry in 30 seconds..."
              Start-Sleep -Seconds 30
            }
          } catch {
            Write-Host "Error during login: $_"
            Write-Host "Will retry in 30 seconds..."
            Start-Sleep -Seconds 30
          }
        }

        if (-not $success) {
          Write-Host "Failed to log in to Docker Hub after $maxRetries attempts."
          exit 1
        }
      shell: powershell
    
    - name: Build and push Frontend image
      run: |
        $maxRetries = 3
        $retryCount = 0
        $success = $false
        
        while (-not $success -and $retryCount -lt $maxRetries) {
          try {
            $retryCount++
            Write-Host "Frontend build/push attempt $retryCount of $maxRetries..."
            
            # Build the image first
            Write-Host "Building frontend image..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-frontend:latest ./frontend
            
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Frontend build failed. Will retry in 20 seconds..."
              Start-Sleep -Seconds 20
              continue
            }
            
            # Then push it with retries
            Write-Host "Pushing frontend image to Docker Hub..."
            docker push ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-frontend:latest
            
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "Successfully pushed frontend image to Docker Hub!"
            } else {
              Write-Host "Frontend image push failed. Will retry in 20 seconds..."
              Start-Sleep -Seconds 20
            }
          } catch {
            Write-Host "Error during frontend build/push: $_"
            Write-Host "Will retry in 20 seconds..."
            Start-Sleep -Seconds 20
          }
        }

        if (-not $success) {
          Write-Host "Failed to build/push frontend image after $maxRetries attempts."
          exit 1
        }
      shell: powershell
    
    - name: Build and push Backend image
      run: |
        $maxRetries = 3
        $retryCount = 0
        $success = $false
        
        while (-not $success -and $retryCount -lt $maxRetries) {
          try {
            $retryCount++
            Write-Host "Backend build/push attempt $retryCount of $maxRetries..."
            
            # Build the image first
            Write-Host "Building backend image..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-backend:latest ./backend
            
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Backend build failed. Will retry in 20 seconds..."
              Start-Sleep -Seconds 20
              continue
            }
            
            # Then push it with retries
            Write-Host "Pushing backend image to Docker Hub..."
            docker push ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-backend:latest
            
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "Successfully pushed backend image to Docker Hub!"
            } else {
              Write-Host "Backend image push failed. Will retry in 20 seconds..."
              Start-Sleep -Seconds 20
            }
          } catch {
            Write-Host "Error during backend build/push: $_"
            Write-Host "Will retry in 20 seconds..."
            Start-Sleep -Seconds 20
          }
        }

        if (-not $success) {
          Write-Host "Failed to build/push backend image after $maxRetries attempts."
          exit 1
        }
      shell: powershell
    
    - name: Update Kubernetes manifests with Docker Hub username
      run: |
        Write-Host "Current Docker Username: ${{ secrets.DOCKER_USERNAME }}"
        $files = @("./kubernetes/frontend-deployment.yaml", "./kubernetes/backend-deployment.yaml")
        foreach ($file in $files) {
          Write-Host "Processing file: $file"
          $content = Get-Content $file
          $updatedContent = $content -replace 'hassangill/nextgen-academy', "${{ secrets.DOCKER_USERNAME }}/nextgen-academy"
          $updatedContent | Set-Content $file
          Write-Host "Updated content:"
          Get-Content $file | Select-String -Pattern "image:"
        }
      shell: powershell
      
    - name: Ensure Minikube is running
      run: |
        $status = minikube status | Out-String
        if ($status -match "Stopped|Nonexistent") {
          Write-Host "Starting Minikube with appropriate resources..."
          minikube start --cpus 2 --memory 3000
        } else {
          Write-Host "Minikube is already running"
        }
        
        # Ensure kubectl can connect
        minikube update-context
        kubectl get nodes
      shell: powershell
    
    - name: Deploy to Kubernetes
      run: |
        # Create the namespace if it doesnt exist
        kubectl apply -f ./kubernetes/namespace.yaml
        
        # Validate YAML files before applying
        Write-Host "Validating Kubernetes YAML files..."
        
        Write-Host "Checking backend-deployment.yaml syntax:"
        kubectl apply --dry-run=client -f ./kubernetes/backend-deployment.yaml
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Error in backend-deployment.yaml. Please fix YAML syntax."
          Write-Host "Content of the file:"
          Get-Content ./kubernetes/backend-deployment.yaml
          
          # Attempt to fix common YAML indentation issues
          Write-Host "Attempting to fix YAML indentation issues..."
          $content = Get-Content ./kubernetes/backend-deployment.yaml -Raw
          $content = $content -replace "app: nextgen-backend\s+spec:", "app: nextgen-backend`n    spec:"
          $content = $content -replace "periodSeconds: 10\s+livenessProbe:", "periodSeconds: 10`n        livenessProbe:"
          $content | Set-Content ./kubernetes/backend-deployment.yaml
          
          # Try validation again
          kubectl apply --dry-run=client -f ./kubernetes/backend-deployment.yaml
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Unable to automatically fix backend-deployment.yaml. Manual fix required."
            exit 1
          }
          Write-Host "Successfully fixed backend-deployment.yaml"
        }
        
        Write-Host "Checking frontend-deployment.yaml syntax:"
        kubectl apply --dry-run=client -f ./kubernetes/frontend-deployment.yaml
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Error in frontend-deployment.yaml. Please fix YAML syntax."
          Write-Host "Content of the file:"
          Get-Content ./kubernetes/frontend-deployment.yaml
          
          # Attempt to fix common YAML indentation issues
          Write-Host "Attempting to fix YAML indentation issues..."
          $content = Get-Content ./kubernetes/frontend-deployment.yaml -Raw
          $content = $content -replace "app: nextgen-frontend\s+spec:", "app: nextgen-frontend`n    spec:"
          $content = $content -replace "periodSeconds: 5\s+livenessProbe:", "periodSeconds: 5`n        livenessProbe:"
          $content | Set-Content ./kubernetes/frontend-deployment.yaml
          
          # Try validation again
          kubectl apply --dry-run=client -f ./kubernetes/frontend-deployment.yaml
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Unable to automatically fix frontend-deployment.yaml. Manual fix required."
            exit 1
          }
          Write-Host "Successfully fixed frontend-deployment.yaml"
        }
        
        # Apply deployments and services
        Write-Host "Applying backend deployment and service..."
        kubectl apply -f ./kubernetes/backend-deployment.yaml
        kubectl apply -f ./kubernetes/backend-service.yaml
        
        Write-Host "Applying frontend deployment and service..."  
        kubectl apply -f ./kubernetes/frontend-deployment.yaml
        kubectl apply -f ./kubernetes/frontend-service.yaml
        
        # Check container images are available
        Write-Host "Checking if images are available in Docker Hub..."
        docker pull ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-backend:latest
        docker pull ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-frontend:latest
        
        # Give some time for the deployments to start
        Write-Host "Waiting for pods to initialize (30 seconds)..."
        Start-Sleep -Seconds 30
        
        # Check pod status and get detailed information if there are issues
        Write-Host "Checking initial pod status..."
        kubectl get pods -n nextgen-academy
        
        # Check for InvalidImageName or other issues
        $problemPods = kubectl get pods -n nextgen-academy -o json | ConvertFrom-Json
        foreach ($pod in $problemPods.items) {
            if ($pod.status.phase -ne "Running") {
                Write-Host "Problem with pod: $($pod.metadata.name)"
                Write-Host "Detailed pod information:"
                kubectl describe pod $pod.metadata.name -n nextgen-academy
            }
        }
        
        # Wait for deployments to be ready with increased timeout
        Write-Host "Waiting for frontend deployment..."
        kubectl rollout status deployment/nextgen-frontend -n nextgen-academy --timeout=300s
        
        Write-Host "Waiting for backend deployment..."
        kubectl rollout status deployment/nextgen-backend -n nextgen-academy --timeout=300s
      shell: powershell
    
    - name: Verify deployment
      run: |
        Write-Host "Checking pods status..."
        kubectl get pods -n nextgen-academy
        
        Write-Host "Checking services status..."
        kubectl get services -n nextgen-academy
        
        Write-Host "Frontend service URL:"
        minikube service nextgen-frontend-service -n nextgen-academy --url
      shell: powershell
