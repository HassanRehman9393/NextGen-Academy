name: Deploy to Kubernetes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-backend:latest
        
    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/nextgen-academy-frontend:latest
        
    - name: Update deployment files
      run: |
        $repoRoot = $env:GITHUB_WORKSPACE
        Write-Host "Repository root: $repoRoot"
        $backendPath = Join-Path -Path $repoRoot -ChildPath "kubernetes\backend-deployment.yaml"
        $frontendPath = Join-Path -Path $repoRoot -ChildPath "kubernetes\frontend-deployment.yaml"
        Write-Host "Updating $backendPath"
        (Get-Content $backendPath) -replace '\${DOCKER_USERNAME}', '${{ secrets.DOCKER_USERNAME }}' | Set-Content $backendPath
        Write-Host "Updating $frontendPath"
        (Get-Content $frontendPath) -replace '\${DOCKER_USERNAME}', '${{ secrets.DOCKER_USERNAME }}' | Set-Content $frontendPath
      shell: pwsh
        
    - name: Deploy to Kubernetes
      run: |
        $repoRoot = $env:GITHUB_WORKSPACE
        $namespacePath = Join-Path -Path $repoRoot -ChildPath "kubernetes\namespace.yaml"
        $kubernetesDirPath = Join-Path -Path $repoRoot -ChildPath "kubernetes"
        Write-Host "Applying namespace: $namespacePath"
        kubectl apply -f $namespacePath
        Write-Host "Applying kubernetes resources from $kubernetesDirPath"
        kubectl apply -k $kubernetesDirPath
      shell: pwsh
        
    - name: Verify deployment
      run: |
        kubectl get all -n nextgen-academy
      shell: pwsh 